<!DOCTYPE html>
<html lang="id">
<head>

    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0e11;
            color: #e8edf2;
            line-height: 1.6;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ----- BUTTONS (BLUE THEME WITH GLOW) ----- */
        .btn-primary {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), 0 8px 20px rgba(59, 130, 246, 0.3);
            text-align: center;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.7), 0 12px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-outline {
            display: inline-block;
            background: transparent;
            color: #e8edf2;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 40px;
            border: 1.5px solid #4b5563;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            border-color: #3b82f6;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* ----- NAVIGATION ----- */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 14, 17, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #1f2937;
            padding: 14px 0;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            white-space: nowrap;
        }

        .logo span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
            margin-left: -6px;
        }

        .logo-img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .nav-links a {
            padding: 6px 0;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .nav-links a:hover {
            border-bottom-color: #3b82f6;
        }

        .nav-cta {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .nav-cta .btn-primary {
            padding: 10px 24px;
            font-size: 0.9rem;
        }

        .nav-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #e8edf2;
        }

        /* ----- HERO ----- */
        .hero {
            padding: 90px 0 70px;
            text-align: center;
        }
        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
        }
        .hero h1 span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.6));
        }
        .hero p {
            max-width: 640px;
            margin: 0 auto 32px;
            font-size: 1.15rem;
            color: #9ca3af;
        }
        .hero .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        /* ----- SECTION TITLE ----- */
        .section-title {
            text-align: center;
            margin-bottom: 48px;
        }
        .section-title h2 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .section-title p {
            color: #9ca3af;
            font-size: 1.05rem;
        }

        }

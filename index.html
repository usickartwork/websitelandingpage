<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Review – Modal 20K Bisa Cuan 10x Lipat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0e11;
            color: #e8edf2;
            line-height: 1.6;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ----- BUTTONS (BLUE THEME WITH GLOW) ----- */
        .btn-primary {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), 0 8px 20px rgba(59, 130, 246, 0.3);
            text-align: center;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.7), 0 12px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-outline {
            display: inline-block;
            background: transparent;
            color: #e8edf2;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 40px;
            border: 1.5px solid #4b5563;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            border-color: #3b82f6;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* ----- NAVIGATION ----- */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 14, 17, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #1f2937;
            padding: 14px 0;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            white-space: nowrap;
        }

        /* Menggabungkan teks logo tanpa spasi sama sekali */
        .logo .brand-name {
            display: inline-flex;
            letter-spacing: -1px;
        }

        .logo .brand-name span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
            margin-left: -2px;
        }

        .logo-img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .nav-links a {
            padding: 6px 0;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .nav-links a:hover {
            border-bottom-color: #3b82f6;
        }

        .nav-cta {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .nav-cta .btn-primary {
            padding: 10px 24px;
            font-size: 0.9rem;
        }

        .nav-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #e8edf2;
        }

        /* ----- HERO ----- */
        .hero {
            padding: 90px 0 70px;
            text-align: center;
        }
        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
        }
        .hero h1 span {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.6));
        }
        .hero p {
            max-width: 640px;
            margin: 0 auto 32px;
            font-size: 1.15rem;
            color: #9ca3af;
        }
        .hero .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        /* ----- SECTION TITLE ----- */
        .section-title {
            text-align: center;
            margin-bottom: 48px;
        }
        .section-title h2 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .section-title p {
            color: #9ca3af;
            font-size: 1.05rem;
        }

        /* ----- PRODUK (cards) ----- */
        .produk {
            padding: 60px 0;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 32px;
            max-width: 950px;
            margin: 0 auto;
        }
        .card {
            background: #141922;
            border-radius: 24px;
            border: 1px solid #2a3340;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: #3b82f6;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.15);
        }
        .card.popular {
            border-color: #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.25), 0 12px 30px rgba(59, 130, 246, 0.1);
        }
        .card.popular:hover {
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.4), 0 15px 35px rgba(59, 130, 246, 0.2);
        }
        .badge-popular {
            position: absolute;
            top: 16px;
            right: 20px;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 4px 16px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            z-index: 10;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
        }

        /* Bagian Banner/Gambar Produk */
        .card-banner {
            width: 100%;
            height: 360px;
            object-fit: cover;
            background: #0b0e11;
            display: block;
            border-bottom: 1px solid #2a3340;
        }

        /* Bagian Konten di Bawah Card */
        .card-body {
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-body h3 {
            font-size: 1.4rem;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .card-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .card ul {
            list-style: none;
            margin: 0 0 24px;
            flex: 1;
        }
        .card ul li {
            padding: 6px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: #d1d5db;
            font-size: 0.92rem;
        }
        .card ul li i {
            color: #3b82f6;
            width: 18px;
            font-size: 0.85rem;
            margin-top: 4px;
            filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.6));
        }

        .card .price-area {
            margin-top: auto;
            margin-bottom: 16px;
        }
        .card .price {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            margin: 0 0 2px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .card .price small {
            font-size: 0.85rem;
            font-weight: 400;
            color: #9ca3af;
            display: block;
        }
        .card .btn-primary {
            width: 100%;
        }

        /* ----- CARA KERJA (steps) ----- */
        .cara-kerja {
            padding: 60px 0;
            background: #0f141a;
        }
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 32px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .step {
            text-align: center;
            padding: 20px 12px;
        }
        .step .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.3rem;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .step h4 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .step p {
            color: #9ca3af;
            font-size: 0.95rem;
        }

        /* ----- FAQ (accordion) ----- */
        .faq {
            padding: 60px 0;
        }
        .faq-list {
            max-width: 740px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .faq-item {
            background: #181e26;
            border-radius: 16px;
            border: 1px solid #2a3340;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .faq-item:hover {
            border-color: rgba(59, 130, 246, 0.4);
        }
        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }
        .faq-question:hover {
            background: #1f2937;
        }
        .faq-question i {
            font-size: 1.2rem;
            transition: transform 0.25s;
            color: #9ca3af;
        }
        .faq-item.active .faq-question i {
            transform: rotate(45deg);
            color: #3b82f6;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
        }
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding: 0 24px;
            color: #d1d5db;
        }
        .faq-item.active .faq-answer {
            max-height: 300px;
            padding: 0 24px 20px;
        }
